; BMZ 618031 CAN monitor — ESP32-C6-WROOM-1
; Module flash confirmed via `esptool.py flash_id` = 16MB, so flash_size/partitions
; are overridden below (no stock board def matches 16MB).

[env:esp32-c6-devkitc-1]
platform = espressif32@^8.0.0
board = esp32-c6-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
; board_build.flash_size only affects build-time (sdkconfig/partition sizing).
; The upload step's esptool invocation takes its --flash_size from this key
; separately — without it, esptool writes an image header still declaring
; the stock board's 8MB, which the bootloader then validates our 16MB
; partition table against and rejects (partition offsets "exceed flash chip
; size 0x800000").
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Board default is ARDUINO_USB_CDC_ON_BOOT=0 and ARDUINO_USB_MODE unset,
    ; which routes Serial/log_i to an unconnected UART instead of the native
    ; USB-JTAG-serial port (the same one used for flashing), and without
    ; USB_MODE=1 the core also picks the wrong (TinyUSB) CDC class, which
    ; fails to build on this variant. Both flags are needed together (see
    ; other ESP32-C6 board defs, e.g. seeed_xiao_esp32c6.json, for the
    ; pattern) so app-level logs actually show up on /dev/ttyACM*.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -std=c++17
build_unflags =
    -std=gnu++11

lib_deps =
    olikraus/U8g2@^2.36.18
    esp32async/ESPAsyncWebServer@^3.12.1
    esp32async/AsyncTCP@^3.5.0
    bblanchon/ArduinoJson@^7.4.3
